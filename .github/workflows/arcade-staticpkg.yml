name: arcade-staticpkg

# Build estatico hospedavel do editor MakeCode Arcade (fork coders).
# Corre a mao (workflow_dispatch). Publica built/packaged como artefacto.
# Iteracao 1: ingles, so para provar que o pipeline staticpkg produz um build
# hospedavel numa runner limpa. O PT entra depois.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: staticpkg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install -g npm@11
          sudo npm install -g pxt

      - name: npm install
        run: npm install

      # O repo do simulador (microsoft/pxt-arcade-sim) e privado -> nao da para checkout.
      # Teste: criar a pasta sim/public (vazia) so para o targetFileList nao crashar e
      # ver se o staticpkg completa e produz built/packaged/index.html. O sim em si e
      # carregado de um CDN sandbox a parte pelo editor em runtime.
      - name: Stub sim public
        run: |
          mkdir -p public sim/public node_modules/pxt-arcade-sim/public
          echo keep > public/.keep
          echo keep > sim/public/.keep
          ls -la public sim/public

      - name: pxt staticpkg
        run: |
          export DISPLAY=:99.0
          Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 &
          sleep 2
          pxt staticpkg --route arcade 2>&1 | tee staticpkg.log
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CI: "true"

      # Hibrido: o repo do simulador e privado, por isso apontamos o sim do nosso editor
      # para o host sandbox publico da Microsoft (runtime do jogo, neutro em linguagem).
      - name: Apontar sim para o host publico
        run: |
          cd built/packaged/arcade
          FILES=$(grep -rlF "/arcade/simulator.html" . 2>/dev/null || true)
          echo "ficheiros a ajustar:"; echo "$FILES"
          for f in $FILES; do
            sed -i \
              -e 's#/arcade/simulator\.html#https://trg-arcade.userpxt.io/---simulator#g' \
              -e 's#/arcade/simulatorserviceworker\.js#https://trg-arcade.userpxt.io/---simserviceworker#g' \
              -e 's#/arcade/workerConfig\.js#https://trg-arcade.userpxt.io/---simworkerconfig#g' \
              "$f"
          done
          echo "=== verificacao (index.html) ==="
          grep -rhoE '"sim[A-Za-z]*Url": "[^"]+"' index.html | sort -u

      - name: Inspecionar saida
        if: always()
        run: |
          echo "=== built/packaged/arcade ==="
          ls -la built/packaged/arcade 2>/dev/null | head -40 || echo "SEM built/packaged/arcade"
          du -sh built/packaged 2>/dev/null || true
          echo "=== arcade/index.html? ==="
          ls -la built/packaged/arcade/index.html 2>/dev/null || echo "SEM arcade/index.html"

      - name: Upload artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-packaged
          path: built/packaged
          retention-days: 7
          if-no-files-found: warn

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staticpkg-log
          path: staticpkg.log
          retention-days: 7
          if-no-files-found: ignore
